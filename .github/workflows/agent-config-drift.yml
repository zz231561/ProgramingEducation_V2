name: Agent config drift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drift-check:
    name: Agent config drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated agent config
        run: python3 scripts/sync_agents_md.py --check
