[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "programing-education-backend"
version = "0.1.0"
description = "AI-powered C++ programming education platform — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.18,<1",  # 5-5 作業附件 multipart 上傳
    "uvicorn[standard]>=0.34,<1",
    # R3 終端中繼直接 import（原僅隨 uvicorn[standard] 間接安裝，顯式宣告防 lock 脫鉤）
    "websockets>=14,<17",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "redis>=5.2,<6",
    "python-dotenv>=1.0,<2",
    "authlib>=1.3,<2",
    "cryptography>=42,<45",
    "PyJWT>=2.8,<3",
    "openai>=1.50,<3",
    "httpx>=0.28,<1",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    # 2-1 RAG：LlamaIndex + pgvector 整合（PGVectorStore 用同步 psycopg2 初始化）
    "llama-index-core>=0.13,<1",
    "llama-index-embeddings-openai>=0.5,<1",
    "llama-index-vector-stores-postgres>=0.5,<1",
    "psycopg2-binary>=2.9,<3",
]

# backend 是 application（flat layout，模組在根層），顯式列 packages 讓
# `pip install -e .` 可用（tech-debt：hatchling 預設找不到 wheel target）
[tool.hatch.build.targets.wheel]
packages = ["api", "core", "models", "services", "scripts"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
# 2026-08-07 100 → 120：實測 54 筆超長行有 46 筆落在 101-120，且多為中文 prompt / 描述字串。
# 中文字元資訊密度高於英文，100 對本專案過嚴；硬拆字串會改動 prompt 內容。
line-length = 120

[tool.ruff.lint]
# 2026-08-07 擴充：原本只有風格與正確性，補上「冗餘 / 低效 / 死代碼」三類
#   B    = bugbear（可疑寫法）      C4   = comprehension 低效
#   SIM  = 可簡化                   PERF = 效能反模式
#   ERA  = 被註解掉的程式碼         RUF  = ruff 自有規則
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PERF", "ERA", "RUF"]
ignore = [
    # 中文專案：全形標點（，。（））被判為 ambiguous unicode，實測 6708 筆全為誤判
    "RUF001",
    "RUF002",
    "RUF003",
    # FastAPI 的 `Depends()` / `Query()` 寫在預設參數是官方用法，實測 174 筆全為誤判
    "B008",
    # `class X(str, Enum)` → `StrEnum` 會改變 `str(member)` 的輸出（前者 "X.A"、後者 "a"）。
    # 專案 14 處 enum 全靠 `.value` 寫入 DB，這是**行為變更**不是風格問題，不由 lint 順手改。
    "UP042",
    # 建議的三元式全都超過一行寬（如 citations.py 的 video_id 解析），可讀性反而變差
    "SIM108",
    # PEP 695 泛型語法遷移屬風格偏好，與正確性無關
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# 測試用巢狀 with 做 monkeypatch，攤平成單行反而看不出堆疊了哪些 patch
"tests/*" = ["SIM117"]
# migration 是凍結的歷史產物（已上生產、不得回頭改）：
#   ERA001 欄位說明註解（`# (order, tag, name_zh)`）被誤判為註解掉的程式碼
#   B905/RUF007 seed 資料的 zip 長度由同一份 literal 保證，改寫無收益且有風險
"alembic/versions/*" = ["ERA001", "B905", "RUF007"]
# 超長行落在**多行中文字串內部**（LLM prompt / 評估預期敘述 / docstring 指令範例），
# 連 `# noqa` 都放不進去（會變成字串內容），硬拆則改動 prompt 文字本身
"scripts/eval_coddy/*" = ["E501"]
"scripts/flag_transcripts.py" = ["E501"]
"scripts/ingest_transcripts_rag.py" = ["E501"]
"services/quiz/validate.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
